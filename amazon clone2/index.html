<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Amazon Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navbar -->
<div class="navbar">
  <div class="logo">amazon</div>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search Amazon">
    <button onclick="searchProduct()">Search</button>
  </div>

  <div class="nav-links">
    <div>Hello, Sign in</div>
    <div>Returns & Orders</div>
    <div>Cart 🛒 (<span id="cart-count">0</span>)</div>
  </div>
</div>

<!-- Hero -->
<div class="hero">
  Welcome to Amazon Clone
</div>

<!-- Products -->
<section class="products" id="product-list">

  <div class="card" data-name="Smartphone">
    <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?q=80&w=800">
    <h3>Smartphone</h3>
    <div class="price">$499</div>
    <button onclick="addToCart('Smartphone',499)">Add to Cart</button>
  </div>

  <div class="card" data-name="Headphones">
    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?q=80&w=800">
    <h3>Headphones</h3>
    <div class="price">$99</div>
    <button onclick="addToCart('Headphones',99)">Add to Cart</button>
  </div>

  <div class="card" data-name="Camera">
    <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?q=80&w=800">
    <h3>Camera</h3>
    <div class="price">$799</div>
    <button onclick="addToCart('Camera',799)">Add to Cart</button>
  </div>

  <div class="card" data-name="Shoes">
    <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=800">
    <h3>Shoes</h3>
    <div class="price">$59</div>
    <button onclick="addToCart('Shoes',59)">Add to Cart</button>
  </div>

</section>

<footer>
  © 2026 Amazon Clone
</footer>

<script src="script.js"></script>
</body>
</html>
