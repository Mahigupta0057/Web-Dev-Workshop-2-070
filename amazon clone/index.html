<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Amazon Clone</title>

  <!-- CSS File -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Navbar -->
  <div class="navbar">
    <div class="logo">amazon</div>

    <div class="search-bar">
      <input type="text" placeholder="Search Amazon">
      <button>Search</button>
    </div>

    <div class="nav-links">
      <div>Hello, Sign in</div>
      <div>Returns & Orders</div>
      <div>Cart 🛒</div>
    </div>
  </div>

  <!-- Hero Section -->
  <div class="hero">
    Welcome to Amazon Clone
  </div>

  <!-- Products -->
  <section class="products">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?q=80&w=800" alt="">
      <h3>Smartphone</h3>
      <div class="price">$499</div>
      <button>Add to Cart</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?q=80&w=800" alt="">
      <h3>Headphones</h3>
      <div class="price">$99</div>
      <button>Add to Cart</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?q=80&w=800" alt="">
      <h3>Camera</h3>
      <div class="price">$799</div>
      <button>Add to Cart</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=800" alt="">
      <h3>Shoes</h3>
      <div class="price">$59</div>
      <button>Add to Cart</button>
    </div>

  </section>

  <!-- Footer -->
  <footer>
    © 2026 Amazon Clone | Made with HTML & CSS
  </footer>

</body>
</html>
